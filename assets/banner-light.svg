<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Laxma Reddy Patlolla. I port frontier models to KerasHub.">
  <style>
    .dash { stroke-dasharray: 10 12; animation: march 1.2s linear infinite; }
    .weight { animation: fly 2.4s linear infinite backwards; }
    .weight.b { animation-delay: 0.8s; }
    .weight.c { animation-delay: 1.6s; }
    @keyframes march { to { stroke-dashoffset: -22; } }
    @keyframes fly {
      0% { transform: translateX(0); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(96px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dash, .weight { animation: none; }
    }
  </style>
  <rect width="1200" height="340" rx="28" fill="#FFF6E9"/>
  <g fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M700 58 v18 M691 67 h18"/>
    <path d="M1126 268 v18 M1117 277 h18"/>
    <circle cx="760" cy="290" r="7"/>
    <circle cx="1140" cy="70" r="5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#14182B">
    <text x="64" y="92" font-size="18" font-weight="700" letter-spacing="4" fill="#C2410C">LAXMA REDDY PATLOLLA</text>
    <text x="64" y="168" font-size="60" font-weight="800">I port frontier models</text>
    <text x="64" y="240" font-size="60" font-weight="800">to <tspan fill="#D00000">KerasHub</tspan></text>
    <text x="64" y="292" font-size="22" font-weight="500" opacity="0.75">Model ports · weight converters · keras.io guides</text>
    <text x="852" y="262" font-size="15" font-weight="600" opacity="0.7" text-anchor="middle">Hugging Face</text>
    <text x="1062" y="262" font-size="15" font-weight="600" opacity="0.7" text-anchor="middle">KerasHub</text>
  </g>
  <circle cx="852" cy="170" r="56" fill="#FFD21E"/>
  <g fill="none" stroke="#14182B" stroke-width="5" stroke-linecap="round">
    <path d="M832 156 v8 M872 156 v8"/>
    <path d="M828 182 q24 24 48 0"/>
  </g>
  <path class="dash" d="M924 170 H990" fill="none" stroke="#14182B" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <g fill="#C2410C">
    <rect class="weight" x="914" y="140" width="12" height="12" rx="3"/>
    <rect class="weight b" x="914" y="164" width="12" height="12" rx="3"/>
    <rect class="weight c" x="914" y="188" width="12" height="12" rx="3"/>
  </g>
  <rect x="1006" y="114" width="112" height="112" rx="22" fill="#D00000"/>
  <text x="1062" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#FFFFFF" text-anchor="middle">K</text>
</svg>
